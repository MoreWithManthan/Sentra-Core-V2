[package]
name = "sentra-core"
version = "2.1.0"
description = "SENTRA CORE — Advanced System Security & Optimization Engine"
authors = ["Manthan"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sentra-core"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri         = { version = "2.0", features = ["tray-icon", "devtools"] }
tauri-plugin-shell      = "2.0"
tauri-plugin-notification = "2.0"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[profile.release]
opt-level = "s"   # optimise for size — Tauri best practice
strip = true
