[project]
name = "sentra-core"
version = "2.3.0"
description = "Advanced System Security & Optimization Engine"
requires-python = ">=3.10"
# Kept in sync with requirements.txt — see that file for version-choice
# rationale and the yara-python / Python 3.14 compatibility note.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.1",
    "psutil>=6.0.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "reportlab>=4.2.0",
    "apscheduler>=3.10.4",
    "watchdog>=4.0.0",
    "yara-python>=4.5.0; python_version < '3.14'",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
