apiVersion: v1
kind: Secret
metadata:
  name: sentra-secrets
  namespace: sentra
type: Opaque
stringData:
  # Replace these with your real API keys.
  # In CI/CD:
  #   kubectl create secret generic sentra-secrets \
  #     --from-literal=VT_API_KEY=$VT_API_KEY \
  #     --from-literal=OTX_API_KEY=$OTX_API_KEY \
  #     --from-literal=ABUSEIPDB_API_KEY=$ABUSEIPDB_API_KEY \
  #     -n sentra
  #
  # Never commit real values here — this file should only ever contain
  # the REPLACE_ME placeholders in version control.
  VT_API_KEY: "REPLACE_ME"
  OTX_API_KEY: "REPLACE_ME"
  ABUSEIPDB_API_KEY: "REPLACE_ME"
