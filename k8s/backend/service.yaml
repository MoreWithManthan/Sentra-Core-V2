apiVersion: v1
kind: Service
metadata:
  name: sentra-backend
  namespace: sentra
  labels:
    app: sentra-backend
spec:
  selector:
    app: sentra-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP    # internal only; Ingress handles external traffic
